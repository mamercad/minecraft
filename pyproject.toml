[project]
name = "minecraft-tui"
version = "0.1.0"
description = "Textual-based TUI for managing Minecraft servers on DigitalOcean"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.2",
    "mcrcon>=0.7.0",
    "paramiko>=4.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pydo>=0.22.0",
    "pyfiglet>=1.0.4",
    "pyperclip>=1.11.0",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "textual>=6.9.0",
]

[project.scripts]
minecraft-tui = "minecraft_tui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pytest-textual-snapshot>=1.1.0",
    "ruff>=0.14.9",
    "textual-dev>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Snapshot test configuration
snapshot_update = false  # Prevent accidental updates
